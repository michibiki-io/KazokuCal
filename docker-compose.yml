services:
  calendar-app:
    build: .
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "28080:8080"
    environment:
      PORT: "8080"
      AUTH_ENABLED: "false"
      AUTH_USER_HEADER: "X-Forwarded-User"
      AUTH_EMAIL_HEADER: "X-Forwarded-Email"
      AUTH_GROUPS_HEADER: "X-Forwarded-Groups"
      AUTHORIZED_GROUPS: "${AUTHORIZED_GROUPS:-}"
      APP_BASE_PATH: "${APP_BASE_PATH:-}"
      DB_DSN: "kazokucal:kazokucal@tcp(mariadb:3306)/kazokucal?parseTime=true&charset=utf8mb4&loc=Asia%2FTokyo"

  mariadb:
    image: mariadb:11.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "23306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: "kazokucal-root"
      MARIADB_DATABASE: "kazokucal"
      MARIADB_USER: "kazokucal"
      MARIADB_PASSWORD: "kazokucal"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -ukazokucal -pkazokucal --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mariadb-data:
